name: oidc-probe
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  dump-token:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .
          echo "---REPO_PROPERTY---"
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq -r 'to_entries[] | select(.key | startswith("repo_property")) | "\(.key)=\(.value)"' 2>/dev/null
